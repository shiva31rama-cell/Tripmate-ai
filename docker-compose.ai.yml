services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - tripmate-ai-service
    ports:
      - "8080:80"

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"

  tripmate-ai-service:
    build:
      context: ./ai
    restart: unless-stopped
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      CORS_ORIGINS: "*"
      APP_USER_AGENT: ${APP_USER_AGENT:-TripMateAI/0.2}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-900}
    depends_on:
      - ollama
    ports:
      - "8000:8000"

volumes:
  ollama_data:
