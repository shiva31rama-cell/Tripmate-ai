name: TripMate CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Install backend dependencies
        run: python -m pip install -r ai/requirements.txt

      - name: Check Python service syntax
        run: python -m compileall -q ai

      - name: Run backend tests
        working-directory: ai
        run: python -m unittest discover -s . -p 'test_*.py'

      - name: Build
        run: npm run build

      - name: Validate Docker Compose configuration
        run: docker compose -f docker-compose.ai.yml config --quiet

      - name: Validate Nginx configuration
        run: docker run --rm -v "$PWD/nginx.conf:/etc/nginx/conf.d/default.conf:ro" nginx:1.29-alpine nginx -t
