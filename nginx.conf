server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA routing: let React/Vite handle client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Do not cache the HTML shell aggressively; this helps deployments pick up new builds.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Static assets generated by Vite can be cached for a long time.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
}
